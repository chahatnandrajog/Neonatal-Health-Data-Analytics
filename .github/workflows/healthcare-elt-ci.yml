name: Healthcare ELT Checks
on:
  push:
    paths:
      - 'portfolio/healthcare-elt-platform/**'
      - '.github/workflows/healthcare-elt-ci.yml'
  pull_request:
    paths:
      - 'portfolio/healthcare-elt-platform/**'
      - '.github/workflows/healthcare-elt-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/healthcare-elt-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests
